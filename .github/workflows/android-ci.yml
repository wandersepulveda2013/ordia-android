name: Build and publish Ordia 3.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ordia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Restore and verify dedicated Ordia update key
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ORDIA_UPDATE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORDIA_UPDATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORDIA_UPDATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORDIA_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64:-}" || { echo "Missing ORDIA_UPDATE_KEYSTORE_BASE64"; exit 1; }
          test -n "${KEYSTORE_PASSWORD:-}" || { echo "Missing ORDIA_UPDATE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo "Missing ORDIA_UPDATE_KEY_ALIAS"; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo "Missing ORDIA_UPDATE_KEY_PASSWORD"; exit 1; }
          test "$KEY_ALIAS" != "androiddebugkey" || { echo "Generic Android debug keys are forbidden"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ordia-update.keystore"
          chmod 600 "$RUNNER_TEMP/ordia-update.keystore"
          keytool -list -keystore "$RUNNER_TEMP/ordia-update.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ORDIA_KEYSTORE_PATH=$RUNNER_TEMP/ordia-update.keystore" >> "$GITHUB_ENV"

      - name: Test, lint and build pull request without secrets
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test lintDebug assembleDebug --stacktrace

      - name: Test, lint and build trusted main update
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          ORDIA_KEYSTORE_PASSWORD: ${{ secrets.ORDIA_UPDATE_KEYSTORE_PASSWORD }}
          ORDIA_KEY_ALIAS: ${{ secrets.ORDIA_UPDATE_KEY_ALIAS }}
          ORDIA_KEY_PASSWORD: ${{ secrets.ORDIA_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test lintDebug assembleDebug --stacktrace

      - name: Prepare immutable APK, metadata and checksum
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          (( GITHUB_RUN_ATTEMPT >= 1 && GITHUB_RUN_ATTEMPT <= 99 ))
          CODE=$((1300000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          (( CODE <= 2147483647 ))
          APK="Ordia-3.0-code-$CODE.apk"
          METADATA="app/build/outputs/apk/debug/output-metadata.json"
          test -f "$METADATA"
          ACTUAL_CODE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["elements"][0]["versionCode"])' "$METADATA")
          test "$ACTUAL_CODE" = "$CODE" || { echo "APK versionCode $ACTUAL_CODE != expected $CODE"; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" | awk -v name="$APK" '{print $1 "  " name}' > "$APK.sha256"
          cat > ordia-release.env <<META
          ORDIA_CODE=$CODE
          ORDIA_APK=$APK
          ORDIA_CHECKSUM=$APK.sha256
          ORDIA_TAG=v3.0.${GITHUB_RUN_NUMBER}-code-$CODE
          META

      - name: Upload verified build artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordia-3.0-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Ordia-3.0-code-*.apk
            Ordia-3.0-code-*.apk.sha256
            ordia-release.env
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ordia-3.0-${{ github.run_id }}-${{ github.run_attempt }}
          path: release

      - name: Publish immutable automatic update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          set -a
          . ./ordia-release.env
          set +a
          [[ "$ORDIA_APK" =~ ^Ordia-3\.0-code-[0-9]+\.apk$ ]]
          [[ "$ORDIA_CHECKSUM" == "$ORDIA_APK.sha256" ]]
          [[ "$ORDIA_TAG" =~ ^v3\.0\.[0-9]+-code-[0-9]+$ ]]
          test -f "$ORDIA_APK"
          test -f "$ORDIA_CHECKSUM"
          sha256sum --check "$ORDIA_CHECKSUM"
          if gh release view "$ORDIA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $ORDIA_TAG already exists; refusing to overwrite immutable update bytes."
            exit 1
          fi
          TITLE="Ordia 3.0 · build ${ORDIA_CODE}"
          NOTES="Compilación automática verificada de Ordia 3.0. Ordia vuelve a validar nombre, hash, paquete, versionCode y certificado antes de abrir el instalador de Android."
          gh release create "$ORDIA_TAG" "$ORDIA_APK" "$ORDIA_CHECKSUM" \
            --title "$TITLE" --notes "$NOTES" --latest --repo "$GITHUB_REPOSITORY"
