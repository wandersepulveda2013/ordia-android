name: Ordia 3.0 CI

on:
  push:
    branches: [main, jules/autonomous-ordia]
  pull_request:
    branches: [main, jules/autonomous-ordia]
  workflow_dispatch:

concurrency:
  group: ordia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # TRABAJO 1 — VERIFY
  # Se ejecuta en pull_request, workflow_dispatch y push.
  # NO recibe secretos.
  # ─────────────────────────────────────────────────────────
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper integrity
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Run full verification (tests, lint, debug build, release build)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test lint assembleDebug assembleRelease --stacktrace

      - name: Upload unsigned release APK (previewAdvanced, to be signed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordia-release-unsigned
          path: app/build/outputs/apk/previewAdvanced/release/app-previewAdvanced-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APKs (all flavors, manual QA only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish build summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "## Ordia 3.0 — Build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.head_ref || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK**: uploaded unsigned as \`ordia-release-unsigned\` (signed later)" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APKs**: uploaded as \`app-debug-apks\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────
  # TRABAJO 2 — SIGN
  # Solo en push confiable a main después de VERIFY.
  # NO ejecuta Gradle ni código del repositorio.
  # ─────────────────────────────────────────────────────────
  sign:
    name: Sign APK
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Download unsigned release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ordia-release-unsigned
          path: unsigned

      - name: Reject debuggable APK before signing
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="unsigned/app-previewAdvanced-release-unsigned.apk"
          test -f "$UNSIGNED" || { echo "Missing $UNSIGNED"; exit 1; }

          # Debuggable APKs must never be signed as a release.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          AAPT2=$(find "$SDK_ROOT/build-tools" -name aapt2 -type f 2>/dev/null | head -1)
          test -n "$AAPT2" || { echo "aapt2 not found in Android SDK"; exit 1; }

          if "$AAPT2" dump badging "$UNSIGNED" | grep -q "application-debuggable"; then
            echo "REFUSING to sign a debuggable APK as release"; exit 1
          fi
          echo "APK is not debuggable, proceeding to sign"

      - name: Restore keystore and sign APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ORDIA_UPDATE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORDIA_UPDATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORDIA_UPDATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORDIA_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Validate secrets exist
          test -n "${KEYSTORE_B64:-}" || { echo "Missing ORDIA_UPDATE_KEYSTORE_BASE64"; exit 1; }
          test -n "${KEYSTORE_PASSWORD:-}" || { echo "Missing ORDIA_UPDATE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo "Missing ORDIA_UPDATE_KEY_ALIAS"; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo "Missing ORDIA_UPDATE_KEY_PASSWORD"; exit 1; }

          # Reject generic debug key
          test "$KEY_ALIAS" != "androiddebugkey" || {
            echo "Generic Android debug keys are forbidden"; exit 1
          }

          # Decode keystore (temporary, cleaned up in post step)
          printf '%s' "$KEYSTORE_B64" | base64 --decode > /tmp/ordia-update.keystore
          chmod 600 /tmp/ordia-update.keystore

          # Validate alias
          keytool -list -keystore /tmp/ordia-update.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          # Find apksigner from Android SDK (installed by setup-java or Gradle)
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER=$(find "$SDK_ROOT" -name apksigner -type f 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            # Fallback: use the one bundled with build-tools
            APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | head -1)
          fi
          test -n "$APKSIGNER" || { echo "apksigner not found in Android SDK"; exit 1; }
          echo "Using apksigner: $APKSIGNER"

          # Sign the release APK
          UNSIGNED="unsigned/app-previewAdvanced-release-unsigned.apk"
          SIGNED="Ordia-3.0-signed.apk"
          cp "$UNSIGNED" "$SIGNED"
          "$APKSIGNER" sign \
            --ks /tmp/ordia-update.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" \
            "$SIGNED"

          # Verify signature
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" 2>&1

          # Calculate checksum
          sha256sum "$SIGNED" | awk '{print $1 "  Ordia-3.0-signed.apk"}' > "$SIGNED.sha256"

          # Clean up keystore immediately
          rm -f /tmp/ordia-update.keystore

          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"
          echo "SIGNED_CHECKSUM=$SIGNED.sha256" >> "$GITHUB_ENV"

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordia-3.0-signed
          path: |
            Ordia-3.0-signed.apk
            Ordia-3.0-signed.apk.sha256
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────
  # TRABAJO 3 — PUBLISH
  # Solo en main después de SIGN.
  # Publica una GitHub Release inmutable.
  # ─────────────────────────────────────────────────────────
  publish:
    name: Publish release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ordia-3.0-signed
          path: release

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release

          APK="Ordia-3.0-signed.apk"
          CHECKSUM="$APK.sha256"

          test -f "$APK" || { echo "Missing $APK"; exit 1; }
          test -f "$CHECKSUM" || { echo "Missing $CHECKSUM"; exit 1; }
          sha256sum --check "$CHECKSUM"

          # Derive versionCode from APK via aapt (from SDK)
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          AAPT2=$(find "$SDK_ROOT/build-tools" -name aapt2 -type f 2>/dev/null | head -1)
          if [ -n "$AAPT2" ]; then
            echo "APK package info:"
            "$AAPT2" dump packagename "$APK" 2>/dev/null || true
          fi

          # Create tag from run info
          TAG="v3.0.0-build.${{ github.run_id }}"
          TITLE="Ordia 3.0 · signed build ${{ github.run_id }}"
          NOTES="APK firmada verificada de Ordia 3.0. Incluye atención contextual, guardianes, actualizador automático y más."

          # Prevent overwriting existing release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."
            exit 1
          fi

          gh release create "$TAG" "$APK" "$CHECKSUM" \
            --title "$TITLE" --notes "$NOTES" --latest --repo "$GITHUB_REPOSITORY"
