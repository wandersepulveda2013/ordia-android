name: Ordia 3.0 CI

on:
  push:
    branches: [main, jules/autonomous-ordia]
  pull_request:
    branches: [main, jules/autonomous-ordia]
  workflow_dispatch:

concurrency:
  group: ordia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # TRABAJO 1 — VERIFY
  # Se ejecuta en pull_request, workflow_dispatch y push.
  # NO recibe secretos.
  # ─────────────────────────────────────────────────────────
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper integrity
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Compute canonical release version code (single source of truth)
        # Contrato canónico de Ordía: tag = v3.0.<build>-code-<versionCode>, donde
        # <versionCode> se comparte EXACTO entre el APK, el tag y el manifiesto.
        # Es monótono y SIEMPRE mayor al último versionCode publicado (para que la
        # app instalada lo detecte como actualización), usando la MISMA regex que
        # UpdateSecurityRules.parseVersionCodeFromTag (no se debilita la seguridad).
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          # Misma regex que UpdateSecurityRules.releaseTagPattern.
          tag_re = re.compile(r"^v3\.0\.\d+-code-(\d+)$")
          # El versionCode debe ser > al MÁXIMO ya publicado con tag VÁLIDO (no
          # basta con la release "latest", que podría tener un tag inválido). Así
          # la app instalada (p.ej. 1300044901) siempre detecta la nueva como
          # actualización, incluso si la latest reciente tenía un formato roto.
          max_published_vc = 0
          try:
              out = subprocess.run(
                  ["gh", "release", "list", "--repo", os.environ["GITHUB_REPOSITORY"],
                   "--limit", "100", "--json", "tagName", "-q", ".[].tagName"],
                  check=True, capture_output=True, text=True).stdout
              for line in out.splitlines():
                  m = tag_re.match(line.strip())
                  if m:
                      max_published_vc = max(max_published_vc, int(m.group(1)))
          except Exception as e:
              print(f"WARN: no se pudieron listar releases ({e}); uso solo la fórmula base.")
          base = 1_300_000_000 + run_number * 100 + attempt
          version_code = max(base, max_published_vc + 100) if max_published_vc else base
          if version_code > 2_147_483_647:
              print("ERROR: versionCode excede Int.MAX_VALUE", file=sys.stderr); sys.exit(1)
          build_number = run_number
          contract = {"versionCode": version_code, "buildNumber": build_number,
                      "attempt": attempt, "maxPublishedVersionCode": max_published_vc,
                      "tag": f"v3.0.{build_number}-code-{version_code}"}
          with open("release-contract.json", "w", encoding="utf-8") as f:
              json.dump(contract, f, ensure_ascii=False, indent=2); f.write("\n")
          gha = os.environ.get("GITHUB_ENV", "")
          if gha:
              with open(gha, "a", encoding="utf-8") as f:
                  f.write(f"ORDIA_VERSION_CODE={version_code}\n")
                  f.write(f"ORDIA_BUILD_NUMBER={build_number}\n")
          print(json.dumps(contract, ensure_ascii=False, indent=2))
          PY

      - name: Run full verification (tests, lint, debug build, release build)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test lint assembleDebug assembleRelease --stacktrace

      - name: Upload unsigned release APKs (all flavors, to be signed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordia-release-unsigned
          path: |
            app/build/outputs/apk/previewSafe/release/*.apk
            app/build/outputs/apk/previewFull/release/*.apk
            app/build/outputs/apk/previewAdvanced/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APKs (all flavors, manual QA only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release contract (versionCode/tag source of truth)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-contract
          path: release-contract.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish build summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "## Ordia 3.0 — Build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.head_ref || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APKs**: uploaded unsigned (safe/full/advanced) as \`ordia-release-unsigned\` (signed later)" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APKs**: uploaded as \`app-debug-apks\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────
  # TRABAJO 2 — SIGN
  # Solo en push confiable a main después de VERIFY.
  # NO ejecuta Gradle ni código del repositorio.
  # ─────────────────────────────────────────────────────────
  sign:
    name: Sign APK
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Download unsigned release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ordia-release-unsigned
          path: unsigned

      - name: Set up Java 17
        # apksigner/keytool require a JDK; ubuntu-latest ships one but pinning
        # Temurin 17 makes the sign job deterministic and matches the build job.
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Inspect downloaded artifact tree
        shell: bash
        run: |
          set -euo pipefail
          echo "Real contents of the 'ordia-release-unsigned' artifact:"
          find unsigned -type f -printf '%p\n' | sort

      # Resolves the REAL path of each flavor's unsigned release APK by filename.
      # The upload-artifact step preserves Gradle's output directory structure
      # (previewSafe/release/, previewFull/release/, previewAdvanced/release/),
      # so we must NOT assume a flat layout. The signed/manifest names are driven
      # by the single FLAVOR loop below and match UpdateSecurityRules.expectedApkName(flavor).
      - name: Reject debuggable APKs before signing
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          AAPT2=$(find "$SDK_ROOT/build-tools" -name aapt2 -type f 2>/dev/null | head -1)
          test -n "$AAPT2" || { echo "aapt2 not found in Android SDK"; exit 1; }
          for FLAVOR in safe full advanced; do
            PATTERN="app-preview${FLAVOR^}-release-unsigned.apk"
            mapfile -t MATCHES < <(find unsigned -type f -name "$PATTERN" | sort)
            if [ "${#MATCHES[@]}" -ne 1 ]; then
              echo "Expected exactly one unsigned APK matching '$PATTERN', found ${#MATCHES[@]}:"
              printf '  %s\n' "${MATCHES[@]}"
              exit 1
            fi
            UNSIGNED="${MATCHES[0]}"
            if "$AAPT2" dump badging "$UNSIGNED" | grep -q "application-debuggable"; then
              echo "REFUSING to sign a debuggable APK as release ($FLAVOR): $UNSIGNED"; exit 1
            fi
            echo "$FLAVOR: $UNSIGNED is not debuggable, proceeding to sign"
          done

      - name: Restore keystore and sign APKs
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ORDIA_UPDATE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORDIA_UPDATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORDIA_UPDATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORDIA_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Validate secrets exist
          test -n "${KEYSTORE_B64:-}" || { echo "Missing ORDIA_UPDATE_KEYSTORE_BASE64"; exit 1; }
          test -n "${KEYSTORE_PASSWORD:-}" || { echo "Missing ORDIA_UPDATE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo "Missing ORDIA_UPDATE_KEY_ALIAS"; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo "Missing ORDIA_UPDATE_KEY_PASSWORD"; exit 1; }

          # Reject generic debug key
          test "$KEY_ALIAS" != "androiddebugkey" || {
            echo "Generic Android debug keys are forbidden"; exit 1
          }

          # Decode keystore (temporary, cleaned up below)
          printf '%s' "$KEYSTORE_B64" | base64 --decode > /tmp/ordia-update.keystore
          chmod 600 /tmp/ordia-update.keystore

          # Validate alias
          keytool -list -keystore /tmp/ordia-update.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          # Find apksigner from Android SDK (installed by setup-java or Gradle)
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER=$(find "$SDK_ROOT" -name apksigner -type f 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            # Fallback: use the one bundled with build-tools
            APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | head -1)
          fi
          test -n "$APKSIGNER" || { echo "apksigner not found in Android SDK"; exit 1; }
          echo "Using apksigner: $APKSIGNER"

          # Sign each flavor release APK with the stable key (naming reconciliado
          # con UpdateSecurityRules.expectedApkName(flavor)). The unsigned APK path
          # is resolved dynamically from the downloaded artifact (see comment above).
          for FLAVOR in safe full advanced; do
            PATTERN="app-preview${FLAVOR^}-release-unsigned.apk"
            mapfile -t MATCHES < <(find unsigned -type f -name "$PATTERN" | sort)
            [ "${#MATCHES[@]}" -eq 1 ] || { echo "Expected exactly one unsigned APK matching '$PATTERN', found ${#MATCHES[@]}"; exit 1; }
            UNSIGNED="${MATCHES[0]}"
            SIGNED="Ordia-3.0-${FLAVOR}-signed.apk"

            "$APKSIGNER" sign \
              --ks /tmp/ordia-update.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$SIGNED" \
              "$UNSIGNED"

            # Verify signature
            "$APKSIGNER" verify --verbose --print-certs "$SIGNED" 2>&1

            # Calculate checksum
            sha256sum "$SIGNED" | awk '{print $1 "  '"$SIGNED"'"}' > "$SIGNED.sha256"
            echo "Signed $SIGNED (from $UNSIGNED)"
          done

          # Clean up keystore immediately
          rm -f /tmp/ordia-update.keystore

          echo "SIGNED_APKS=Ordia-3.0-safe-signed.apk Ordia-3.0-full-signed.apk Ordia-3.0-advanced-signed.apk" >> "$GITHUB_ENV"

      - name: Upload signed APKs and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordia-3.0-signed
          path: |
            Ordia-3.0-safe-signed.apk
            Ordia-3.0-safe-signed.apk.sha256
            Ordia-3.0-full-signed.apk
            Ordia-3.0-full-signed.apk.sha256
            Ordia-3.0-advanced-signed.apk
            Ordia-3.0-advanced-signed.apk.sha256
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────
  # TRABAJO 3 — PUBLISH
  # Solo en main después de SIGN.
  # Publica una GitHub Release inmutable.
  # ─────────────────────────────────────────────────────────
  publish:
    name: Publish release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download signed APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ordia-3.0-signed
          path: release

      - name: Download release contract (versionCode/tag source of truth)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-contract
          path: contract

      - name: Set up Java 17 (aapt2 to read APK versionCode)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Publish immutable release with per-flavor manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release

          # Fuente única de verdad: el contracto calculado en el job verify.
          VERSION_CODE=$(python3 -c "import json;print(json.load(open('../contract/release-contract.json'))['versionCode'])")
          BUILD_NUMBER=$(python3 -c "import json;print(json.load(open('../contract/release-contract.json'))['buildNumber'])")
          RUN_ATTEMPT=${{ github.run_attempt }}
          TAG="v3.0.${BUILD_NUMBER}-code-${VERSION_CODE}"
          TITLE="Ordia 3.0 · v${BUILD_NUMBER} (code ${VERSION_CODE})"
          NOTES="APKs firmadas y verificadas de Ordía 3.0. Contrato canónico: tag v3.0.<build>-code-<versionCode>. Incluyen atención contextual, guardianes y actualizador automático por manifiesto."
          echo "Publishing tag=$TAG versionCode=$VERSION_CODE buildNumber=$BUILD_NUMBER"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          AAPT2=$(find "$SDK_ROOT/build-tools" -name aapt2 -type f 2>/dev/null | head -1)
          test -n "$AAPT2" || { echo "aapt2 not found"; exit 1; }

          for FLAVOR in safe full advanced; do
            APK="Ordia-3.0-${FLAVOR}-signed.apk"
            CHECKSUM="$APK.sha256"
            MANIFEST="update-manifest-${FLAVOR}.json"
            VERSION_NAME="3.0.${BUILD_NUMBER}-preview-${FLAVOR}.${RUN_ATTEMPT}"
            APK_URL="https://github.com/wandersepulveda2013/ordia-android/releases/latest/download/${APK}"

            test -f "$APK" || { echo "Missing $APK"; exit 1; }
            test -f "$CHECKSUM" || { echo "Missing $CHECKSUM"; exit 1; }
            sha256sum --check "$CHECKSUM"

            SHA256=$(awk '{print $1}' "$CHECKSUM")
            SIZE=$(stat -c%s "$APK")
            RELEASE_DATE=$(date +%F)

            # El versionCode embebido en la APK debe ser EXACTAMENTE el del contrato.
            APK_VC=$("$AAPT2" dump badging "$APK" | sed -n "s/.*package: name='\([^']*\)' versionCode='\([0-9]*\)'.*/\2/p" | head -1)
            test "$APK_VC" = "$VERSION_CODE" || { echo "APK $FLAVOR versionCode ($APK_VC) != contract ($VERSION_CODE)"; exit 1; }

            MANIFEST_PATH="$MANIFEST" \
            M_VERSION_CODE="$VERSION_CODE" \
            M_VERSION_NAME="$VERSION_NAME" \
            M_APK_URL="$APK_URL" \
            M_SHA256="$SHA256" \
            M_SIZE="$SIZE" \
            M_RELEASE_DATE="$RELEASE_DATE" \
            M_FLAVOR="$FLAVOR" \
            python3 -c 'import json,os; d={"versionCode":int(os.environ["M_VERSION_CODE"]),"versionName":os.environ["M_VERSION_NAME"],"apkUrl":os.environ["M_APK_URL"],"sha256":os.environ["M_SHA256"],"size":int(os.environ["M_SIZE"]),"releaseDate":os.environ["M_RELEASE_DATE"],"changelog":"Versión 3.0 de Ordía para el canal {}: estabilidad, guardianes y actualizador automático.".format(os.environ["M_FLAVOR"]),"mandatory":False,"minSupportedVersion":1,"channel":"stable"}; open(os.environ["MANIFEST_PATH"],"w",encoding="utf-8").write(json.dumps(d,ensure_ascii=False,indent=2)+"\n")'

            python3 -c "import json; json.load(open('$MANIFEST'))" \
              || { echo "Invalid JSON in $MANIFEST"; exit 1; }
            echo "Generated $MANIFEST (versionCode=$VERSION_CODE, sha256=$SHA256, size=$SIZE)"
          done

          # Bootstrap de la app YA INSTALADA (convención legacy por versionCode):
          # la release histórica publicaba un único asset Ordia-3.0-code-<versionCode>.apk
          # (flavor advanced). Lo replicamos con la APK advanced firmada para que el
          # validador instalado (selectExpectedApk(versionCode)) la encuentre y actualice.
          LEGACY_APK="Ordia-3.0-code-${VERSION_CODE}.apk"
          cp "Ordia-3.0-advanced-signed.apk" "$LEGACY_APK"
          sha256sum "$LEGACY_APK" | awk '{print $1 "  '"$LEGACY_APK"'"}' > "$LEGACY_APK.sha256"
          echo "Created legacy bootstrap asset $LEGACY_APK"

          # ── Validación de contrato CI ↔ app (debe pasar ANTES de publicar) ──
          # Replica exacta de UpdateSecurityRules.releaseTagPattern y parseVersionCodeFromTag.
          python3 - "$TAG" "$VERSION_CODE" update-manifest-safe.json update-manifest-full.json update-manifest-advanced.json <<'PY'
          import json, re, sys
          tag, expected_vc = sys.argv[1], int(sys.argv[2])
          tag_re = re.compile(r"^v3\.0\.\d+-code-(\d+)$")
          m = tag_re.match(tag)
          assert m, f"TAG rechazado por releaseTagPattern: {tag}"
          parsed_vc = int(m.group(1))
          assert parsed_vc > 0, "versionCode del tag debe ser > 0"
          assert parsed_vc == expected_vc, f"versionCode del tag ({parsed_vc}) != contrato ({expected_vc})"
          expected_apk = {f: f"Ordia-3.0-{f}-signed.apk" for f in ("safe","full","advanced")}
          for mf in sys.argv[3:]:
              d = json.load(open(mf))
              assert d["versionCode"] == expected_vc, f"{mf} versionCode {d['versionCode']} != {expected_vc}"
              flav = mf.replace("update-manifest-","").replace(".json","")
              url_file = d["apkUrl"].rsplit("/",1)[-1]
              assert url_file == expected_apk[flav], f"{mf} apkUrl filename {url_file} != {expected_apk[flav]}"
              assert re.match(r"^[0-9a-f]{64}$", d["sha256"]), f"{mf} sha256 inválido"
              assert d["channel"] == "stable", f"{mf} canal no estable"
          print("Contrato CI↔app OK: tag válido, versionCode coherente, manifests coherentes.")
          PY

          # No sobrescribir una release existente (inmutabilidad).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."
            exit 1
          fi

          gh release create "$TAG" \
            Ordia-3.0-safe-signed.apk Ordia-3.0-safe-signed.apk.sha256 update-manifest-safe.json \
            Ordia-3.0-full-signed.apk Ordia-3.0-full-signed.apk.sha256 update-manifest-full.json \
            Ordia-3.0-advanced-signed.apk Ordia-3.0-advanced-signed.apk.sha256 update-manifest-advanced.json \
            "$LEGACY_APK" "$LEGACY_APK.sha256" \
            --title "$TITLE" --notes "$NOTES" --latest --repo "$GITHUB_REPOSITORY"

          echo "### Release publicada" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "- Tag: \`$TAG\`" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "- versionCode: $VERSION_CODE" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "- Assets: 11 (3 APK signed + 3 sha256 + 3 manifests + 1 legacy bootstrap APK + 1 legacy sha256)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
