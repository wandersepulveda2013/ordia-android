name: Compilar APK de Ordia

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Extraer código fuente
        run: |
          mkdir ordia-source
          unzip -o Ordia-source.zip -d ordia-source
          echo "Contenido extraído:"
          find ordia-source -maxdepth 3 -type f | head -100

      - name: Buscar proyecto Android
        id: project
        shell: bash
        run: |
          GRADLEW_PATH=$(find ordia-source -type f -name gradlew | head -1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "No se encontró el archivo gradlew."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Dar permisos a Gradle
        run: chmod +x "${{ steps.project.outputs.dir }}/gradlew"

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Localizar APK
        run: |
          find "${{ steps.project.outputs.dir }}" -type f -name "*.apk"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Ordia-2.0-debug-apk
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
