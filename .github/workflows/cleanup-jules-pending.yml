name: Cleanup Jules Pending Sessions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Run Cleanup Script
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          cat << 'EOF' > cleanup.py
          import urllib.request
          import urllib.error
          import json
          import os
          import sys

          api_key = os.environ.get('JULES_API_KEY')
          if not api_key:
              print('Error: JULES_API_KEY environment variable not set.')
              sys.exit(1)

          base_url = 'https://jules.googleapis.com/v1alpha/sessions'
          target_source = 'sources/github/wandersepulveda2013/ordia-android'
          target_states = {'QUEUED', 'PLANNING', 'AWAITING_PLAN_APPROVAL', 'AWAITING_USER_FEEDBACK', 'IN_PROGRESS', 'PAUSED'}

          def get_sessions():
              sessions = []
              page_token = None
              while True:
                  url = f'{base_url}?pageSize=100'
                  if page_token:
                      url += f'&pageToken={page_token}'

                  req = urllib.request.Request(url, headers={'x-goog-api-key': api_key})
                  try:
                      with urllib.request.urlopen(req) as response:
                          data = json.loads(response.read().decode('utf-8'))
                          sessions.extend(data.get('sessions', []))
                          page_token = data.get('nextPageToken')
                          if not page_token:
                              break
                  except Exception as e:
                      print(f'Error fetching sessions: {e}')
                      sys.exit(1)
              return sessions

          print('Fetching sessions...')
          sessions = get_sessions()
          pending_sessions = [s for s in sessions if s.get('sourceContext', {}).get('source') == target_source and s.get('state') in target_states]

          found = len(pending_sessions)
          print(f'Found {found} pending sessions to delete.')

          deleted = 0
          failed = 0

          for s in pending_sessions:
              session_name = s.get('name')
              if not session_name:
                  continue

              session_id = session_name.split('/')[-1] if session_name.startswith('sessions/') else session_name
              del_url = f'{base_url}/{session_id}'
              req = urllib.request.Request(del_url, method='DELETE', headers={'x-goog-api-key': api_key})
              try:
                  with urllib.request.urlopen(req) as response:
                      deleted += 1
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      deleted += 1
                  else:
                      failed += 1
                      print(f'Error deleting session {session_id} - Title: {s.get("title", "Unknown")} - State: {s.get("state")} - Status: {e.code}')
              except Exception as e:
                  failed += 1
                  print(f'Error deleting session {session_id} - Title: {s.get("title", "Unknown")} - State: {s.get("state")} - Status: {e}')

          print('Refetching sessions to verify...')
          final_sessions = get_sessions()
          remaining_pending = [s for s in final_sessions if s.get('sourceContext', {}).get('source') == target_source and s.get('state') in target_states]
          remaining = len(remaining_pending)

          print('\n--- SUMMARY ---')
          print(f'FOUND_PENDING={found}')
          print(f'DELETED={deleted}')
          print(f'FAILED={failed}')
          print(f'REMAINING_PENDING={remaining}')
          EOF
          python3 cleanup.py
